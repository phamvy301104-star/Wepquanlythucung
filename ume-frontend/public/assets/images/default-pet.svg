  <text x="200" y="300" text-anchor="middle" fill="#a89ec9" font-family="Arial, sans-serif" font-size="15" font-weight="500">Thú cưng</text>
  <text x="200" y="325" text-anchor="middle" fill="#7a7199" font-family="Arial, sans-serif" font-size="12">Chưa có hình ảnh</text>
